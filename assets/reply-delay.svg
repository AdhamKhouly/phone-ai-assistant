<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="720" height="250" role="img" aria-label="Reply delay, grouped by second">
<style>
  .bg{fill:#fcfcfb} .t1{fill:#0b0b0b} .t2{fill:#52514e} .grid{stroke:#e6e5e0} .band{fill:#f0efec}
  .s1{fill:#2a78d6} .s2{fill:#eb6834} .link{stroke:#c3c2b7} .ring{stroke:#fcfcfb}
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  @media (prefers-color-scheme: dark){
    .bg{fill:#1a1a19} .t1{fill:#f0efec} .t2{fill:#c3c2b7} .grid{stroke:#383835} .band{fill:#262624}
    .s1{fill:#3987e5} .s2{fill:#d95926} .link{stroke:#52514e} .ring{stroke:#1a1a19}
  }
</style>
<rect class="bg" width="720" height="250" rx="8"/>
<text class="t1" x="24" y="34" font-size="17" font-weight="600">How long the caller waits for a reply</text>
<text class="t2" x="24" y="56" font-size="13">60 turns of scripted conversation, qwen3:8b. Median 1.3 s, slowest 2.1 s.</text>
<line class="grid" x1="110" y1="72" x2="110" y2="224"/>
<text class="t2" x="98" y="93" font-size="13" text-anchor="end">Under 1 s</text>
<path class="s1" d="M110,78 h32.2 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-32.2 z"/>
<text class="t1" x="154.22641509433961" y="93" font-size="13">4 turns (7%)</text>
<text class="t2" x="98" y="131" font-size="13" text-anchor="end">1 to 2 s</text>
<path class="s1" d="M110,116 h476.0 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-476.0 z"/>
<text class="t1" x="598.0" y="131" font-size="13">53 turns (88%)</text>
<text class="t2" x="98" y="169" font-size="13" text-anchor="end">2 to 3 s</text>
<path class="s1" d="M110,154 h23.2 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-23.2 z"/>
<text class="t1" x="145.16981132075472" y="169" font-size="13">3 turns (5%)</text>
<text class="t2" x="98" y="207" font-size="13" text-anchor="end">Over 3 s</text>

<text class="t1" x="118.0" y="207" font-size="13">0 turns (0%)</text>
</svg>
